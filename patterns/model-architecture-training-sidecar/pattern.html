<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Model Architecture Training Sidecar Pattern</title>
  <link rel="stylesheet" href="../../tokens/foundation.css">
  <link rel="stylesheet" href="../../tokens/semantic.css">
  <link rel="stylesheet" href="../../tokens/components.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../model-architecture-3d-deck/pattern.css?v=pp-boundary-detail-v17">
  <link rel="stylesheet" href="./pattern.css?v=pp-boundary-detail-v17">
  <style>
    html,body{height:100%;margin:0;background:var(--background);color:var(--foreground)}
    body{min-height:1430px;font-family:var(--font-sans)}
    .pattern-page{height:100%;padding:12px;box-sizing:border-box}
    .pattern-page[data-embed="true"]{padding:0}
    #trainingSidecarPattern{height:100%;min-height:1400px}
  </style>
</head>
<body>
  <main class="pattern-page" id="patternPage">
    <section id="trainingSidecarPattern" aria-label="openPangu model architecture training semantics sidecar"></section>
  </main>
  <script src="../model-graphviz/pattern.js?v=pp-boundary-detail-v17"></script>
  <script src="../model-architecture-3d-deck/pattern.js?v=pp-boundary-detail-v17"></script>
  <script src="./pattern.js?v=pp-boundary-detail-v17"></script>
  <script>
    const params=new URLSearchParams(location.search);
    const theme=params.get('theme')==='light'?'light':'dark';
    document.documentElement.dataset.theme=theme;
    document.getElementById('patternPage').dataset.embed=String(params.get('embed')==='1');
    const layerParam=params.get('layer');
    window.trainingSidecarController=window.PtoModelArchitectureTrainingSidecar.render('#trainingSidecarPattern',{
      preset:'openpangu-flash',
      initialView:params.get('view')||'right',
      parallelMode:params.get('parallel')||'pp',
      initialTheme:theme,
      initialLayer:layerParam!==null&&Number.isFinite(Number(layerParam))?Number(layerParam):null
    });
    window.addEventListener('message',event=>{
      if(event.data?.type==='pto-preview-theme')window.trainingSidecarController?.setTheme(event.data.theme==='light'?'light':'dark');
    });
  </script>
</body>
</html>
